# All chrome colors use ANSI palette indices (colour0-15) so the terminal's
# theme (ghostty) drives them — tmux adds no colors of its own.

# Status bar inherits the terminal background
set -g status-style 'fg=default,bg=default'

# Active tab: dark text on yellow accent for clear contrast
set -g window-status-current-style 'fg=colour0,bg=colour3,bold'

# Activity indicator: subtle highlight
set -g window-status-activity-style 'fg=colour7,bg=colour8'

# Thin separator between tabs
set -g window-status-separator '#[fg=colour8]│'

# Session name on left in blue accent, session count as circle icon
set -g status-left '#[fg=colour0,bg=colour4,bold] #S#{?#{==:#{server_sessions},1},, #{?#{==:#{server_sessions},2},󰲣,#{?#{==:#{server_sessions},3},󰲥,#{?#{==:#{server_sessions},4},󰲧,#{?#{==:#{server_sessions},5},󰲩,#{?#{==:#{server_sessions},6},󰲫,#{?#{==:#{server_sessions},7},󰲭,#{?#{==:#{server_sessions},8},󰲯,#{?#{==:#{server_sessions},9},󰲱,󰲳}}}}}}}}} #[bg=default] '
set -g status-left-length 20

# Pane borders: gray when inactive, bright when active
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour7'

# Messages and copy-mode selection in muted palette colors. The fill= keeps the
# prompt/message repainting the whole status line: tmux 3.7 draws the message as
# a format that only covers its own text width and overlays the rest, so without
# fill the window tabs bleed through behind the rename prompt (CHANGES 3.7, #4861).
set -g message-style 'fg=colour7,bg=colour0,fill=colour0'
set -g message-command-style 'fg=colour7,bg=colour0,fill=colour0'
set -g mode-style 'fg=default,bg=colour8'

# Pane headers: circle-number icon plus state glyph — filled number + 󰈸 on
# the active pane, dimmed outline number + 󰜗 on unfocused panes (󰲲/󰲳 for 10+)
# Default off (single pane); hooks toggle on when multiple panes exist
set -g pane-border-status off
set -g @pane-num-filled '#{?#{==:#{pane_index},1},󰲠,#{?#{==:#{pane_index},2},󰲢,#{?#{==:#{pane_index},3},󰲤,#{?#{==:#{pane_index},4},󰲦,#{?#{==:#{pane_index},5},󰲨,#{?#{==:#{pane_index},6},󰲪,#{?#{==:#{pane_index},7},󰲬,#{?#{==:#{pane_index},8},󰲮,#{?#{==:#{pane_index},9},󰲰,󰲲}}}}}}}}}'
set -g @pane-num-outline '#{?#{==:#{pane_index},1},󰲡,#{?#{==:#{pane_index},2},󰲣,#{?#{==:#{pane_index},3},󰲥,#{?#{==:#{pane_index},4},󰲧,#{?#{==:#{pane_index},5},󰲩,#{?#{==:#{pane_index},6},󰲫,#{?#{==:#{pane_index},7},󰲭,#{?#{==:#{pane_index},8},󰲯,#{?#{==:#{pane_index},9},󰲱,󰲳}}}}}}}}}'
set -g pane-border-format '#{?pane_active,#[fg=colour3] #{E:@pane-num-filled} 󰈸 ,#[fg=colour8] #{E:@pane-num-outline} 󰜗 }'

# Auto-show/hide pane borders: hidden when zoomed or single pane
set-hook -g after-split-window 'if -F "#{||:#{window_zoomed_flag},#{==:#{window_panes},1}}" "set pane-border-status off" "set pane-border-status top"'
set-hook -g pane-exited        'if -F "#{||:#{window_zoomed_flag},#{==:#{window_panes},1}}" "set pane-border-status off" "set pane-border-status top"'
set-hook -g after-resize-pane  'if -F "#{||:#{window_zoomed_flag},#{==:#{window_panes},1}}" "set pane-border-status off" "set pane-border-status top"'

# Pane count as icon (empty for 1 pane, 󰏁 for 10+)
set -g @pane-count '#{?#{==:#{window_panes},1},, #{?#{==:#{window_panes},2},󰎩,#{?#{==:#{window_panes},3},󰎬,#{?#{==:#{window_panes},4},󰎮,#{?#{==:#{window_panes},5},󰎰,#{?#{==:#{window_panes},6},󰎵,#{?#{==:#{window_panes},7},󰎸,#{?#{==:#{window_panes},8},󰎻,#{?#{==:#{window_panes},9},󰎾,󰏁}}}}}}}}}'

# Composable window status format - plugins can set @wsc-plugin to inject content
set -g @wsc-prefix ' #I:#W'
# @wsc-plugin intentionally not set - plugins fill this slot, empty if unset
set -g @wsc-suffix '#{?window_zoomed_flag, 󰋲,}#{E:@pane-count}'
set -g window-status-current-format '#{E:@wsc-prefix}#{E:@wsc-suffix}#{E:@wsc-plugin} '

# Inactive window tabs (no flags)
set -g window-status-format ' #I:#W#{?window_zoomed_flag, 󰋲,}#{E:@pane-count} '

# Date and time on the right, mirroring the session block on the left: muted
# date against the terminal background, then the clock on the same blue accent.
set -g status-right '#[fg=colour8] %a %b %-d #[fg=colour0,bg=colour4,bold] %-I:%M %p '
set -g status-right-length 30
# Repaint often enough that the minute never sits stale.
set -g status-interval 15
