# Session switching
bind-key -n M-5 run-shell "$HOME/.local/bin/tmux-cycle-session prev"
bind-key -n M-6 run-shell "$HOME/.local/bin/tmux-cycle-session next"
bind-key -n M-7 choose-session

# Left-click the session-name block (status-left) toggles the session picker:
# open it, or click again to dismiss. The picker is a tree-mode pane, so it
# exits on the literal 'q' key (it ignores copy-mode's '-X cancel'). Pointer-only
# round trip — no keyboard needed to open or close.
bind-key -n MouseDown1StatusLeft if-shell -F '#{==:#{pane_mode},tree-mode}' 'send-keys q' 'choose-session'
