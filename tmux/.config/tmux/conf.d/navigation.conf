# Pane selection (preserves zoom state via native -Z flag)
bind -n M-h select-pane -LZ
bind -n M-j select-pane -DZ
bind -n M-k select-pane -UZ
bind -n M-l select-pane -RZ

# Pane cycling (sequential, wraps around)
bind -n M-, select-pane -t :.- -Z
bind -n M-. select-pane -t :.+ -Z

# Prefix+arrow pane selection (also preserves zoom state)
bind Left  select-pane -LZ
bind Down  select-pane -DZ
bind Up    select-pane -UZ
bind Right select-pane -RZ

# Pane resizing — Alt+Shift+h/j/k/l.
# With `extended-keys always` (tmux.conf), Ghostty reports Option+Shift+h as the
# uppercase keycode H *carrying its own Shift modifier* (CSI 27;4;72~), which tmux
# decodes as M-S-H — not M-H (which lacks the shift flag) and not M-S-h (lowercase
# keycode). Bind M-S-H for that path; keep the bare M-H form as a fallback for when
# extended keys are off and the key arrives legacy as ESC+H.
bind -n M-S-H resize-pane -L 5
bind -n M-S-J resize-pane -D 5
bind -n M-S-K resize-pane -U 5
bind -n M-S-L resize-pane -R 5
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Zoom toggle
bind -n M-z resize-pane -Z

# Window switching
bind-key -n M-1 select-window -p
bind-key -n M-2 select-window -n

# Move windows (swap adjacent, shift at boundaries)
# Absolute paths: the tmux server's PATH has no ~/.local/bin, so bare
# script names fail run-shell with exit 127
bind-key -n M-3 run-shell "$HOME/.local/bin/tmux-move-window left"
bind-key -n M-4 run-shell "$HOME/.local/bin/tmux-move-window right"
