# Enable focus events for vim/neovim auto-reload
set-option -g focus-events on

# Terminal feature passthrough. These MUST stay inline here, not in conf.d/ —
# terminal-features only registers during the initial config parse, before
# tmux sets up client terminals. The conf.d loader (run-shell, below) is
# async and fires too late, so feature flags set there silently no-op at
# cold start.
#   - update-environment COLORTERM: ghostty sets COLORTERM=truecolor; carry it
#     into panes so apps emit 24-bit RGB under TERM=tmux-256color.
#   - terminal-features RGB: tell tmux the outer client (xterm-ghostty, whose
#     terminfo advertises only colors#256) is truecolor, so it passes RGB
#     through without reducing terminal color capability.
#   - terminal-features extkeys: tell tmux the outer client supports modified
#     key reporting, so S-Enter / C-Enter can reach pane apps.
set -ga update-environment COLORTERM
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB:extkeys"

# Extended keys (CSI-u): let tmux request modified-key reporting from ghostty
# and forward it to apps, so chords like S-Enter / C-Enter reach terminal
# applications instead of collapsing to a bare Enter (CR). Kept inline (not
# conf.d) for the same cold-start reason as terminal-features above — the
# option must be set before the client terminal is negotiated. Always mode keeps
# these modified keys available for apps that do not request extended-key mode.
# Emit the csi-u encoding (CSI code ; mod u) rather than tmux's default xterm
# form (CSI 27 ; mod ; code ~), which Kitty-protocol apps decode.
set -g extended-keys always
set -g extended-keys-format csi-u

# Prefix (C-o stays free for Claude Code's transcript-mode toggle;
# bootstrap.sh disables the macOS Ctrl+Space input-source hotkey)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General settings
# Mouse mode forwards wheel events to apps that request them (Claude Code
# fullscreen rendering needs this for wheel scrolling)
set -g mouse on
set -g detach-on-destroy off
setw -g aggressive-resize on
# Kept modest: large scrollback on long-lived servers correlates with the
# macOS/ARM copy-mode grid corruption crash (tmux/tmux#5385)
set-option -g history-limit 20000
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Source configuration fragments
run-shell 'for conf in ~/.config/tmux/conf.d/*.conf; do [ -e "$conf" ] && tmux source-file "$conf"; done'
