name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Funk configures a Mac, but its suite is mostly static analysis of shell and
    # plists, which is portable. The checks that genuinely need macOS — pfctl,
    # Gatekeeper xattrs and BSD stat — skip themselves here and
    # name what they skipped, and the operator's own `tests/validate.sh` run on
    # the machine is where those execute. Ubuntu is where the portable majority
    # runs fastest; a macOS runner would spend its extra minutes re-running the
    # same greps.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: funk

      - name: Check out AgentStart
        # Funk asserts its half of the AgentStart contract and drives `funk update`
        # against that checkout, so the sibling has to be here or the suite refuses
        # to run. FUNK_AGENTSTART_ROOT below is the override the suite already has,
        # which is why nothing needs to sit at ~/code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: possibilities/agentstart
          path: agentstart

      - name: Install test dependencies
        # The suite fakes brew, tailscale, adb, and the notifier through
        # tests/fixtures; these it runs for real. shellcheck especially:
        # validate.sh skips that pass when the binary is missing, and a green run
        # that silently linted nothing is the failure this repository warns about.
        # shellcheck is apt's on purpose. validate.sh asks it for errors and
        # warnings only, which every release agrees on, so there is nothing to
        # gain from pinning a version — and the pinned release binary wants ~3.7GB
        # of RSS to check a five-line fixture, which is a strange dependency for a
        # lint step to carry.
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow zsh jq
          shellcheck --version | sed -n 2p

      - name: Validate
        working-directory: funk
        env:
          FUNK_AGENTSTART_ROOT: ${{ github.workspace }}/agentstart
        run: tests/validate.sh
