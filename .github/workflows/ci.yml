name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # tests/validate.sh lints plists with plutil and PlistBuddy and parses the
    # travel firewall through pfctl, so the suite only means anything on macOS.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: funk

      - name: Check out Agentdots
        # Funk asserts its half of the Agentdots contract and drives `funk update`
        # against that checkout, so the sibling has to be here or the suite refuses
        # to run. FUNK_AGENTDOTS_ROOT below is the override the suite already has,
        # which is why nothing needs to sit at ~/code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: possibilities/agentdots
          path: agentdots

      - name: Install test dependencies
        # The suite fakes brew, tailscale, and the notifier through tests/fixtures,
        # but stow and shellcheck are run for real. shellcheck especially: validate.sh
        # skips that pass when the binary is missing, and a green run that silently
        # linted nothing is the exact failure this repository warns about elsewhere.
        # jq and ruby ship with the runner; assert them rather than discover it late.
        run: |
          missing=()
          for tool in stow shellcheck; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            brew install "${missing[@]}"
          fi
          for tool in stow shellcheck jq ruby; do
            command -v "$tool" >/dev/null 2>&1 || {
              printf 'ci: %s is required by tests/validate.sh and is missing\n' "$tool" >&2
              exit 1
            }
          done
          shellcheck --version

      - name: Validate
        working-directory: funk
        env:
          FUNK_AGENTDOTS_ROOT: ${{ github.workspace }}/agentdots
        run: tests/validate.sh
