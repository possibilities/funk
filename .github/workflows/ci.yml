name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # tests/validate.sh lints plists with plutil and PlistBuddy and parses the
    # travel firewall through pfctl, so the suite only means anything on macOS.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: funk

      - name: Check out Agentdots
        # Funk asserts its half of the Agentdots contract and drives `funk update`
        # against that checkout, so the sibling has to be here or the suite refuses
        # to run. FUNK_AGENTDOTS_ROOT below is the override the suite already has,
        # which is why nothing needs to sit at ~/code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: possibilities/agentdots
          path: agentdots

      - name: Install shellcheck
        # validate.sh skips its shellcheck pass when the binary is missing, which
        # is the silent-hole failure Funk warns about elsewhere: a green run that
        # never linted anything. Install it so the gate is real.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
          shellcheck --version

      - name: Validate
        working-directory: funk
        env:
          FUNK_AGENTDOTS_ROOT: ${{ github.workspace }}/agentdots
        run: tests/validate.sh
