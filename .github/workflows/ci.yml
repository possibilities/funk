name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Funk configures a Mac, but its suite is mostly static analysis of shell and
    # plists, which is portable. The checks that genuinely need macOS — pfctl,
    # Gatekeeper xattrs, BSD stat, the Orca installer — skip themselves here and
    # name what they skipped, and the operator's own `tests/validate.sh` run on
    # the machine is where those execute. Ubuntu keeps this off the 10x macOS
    # runner minutes that a private repository pays for.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: funk

      - name: Check out Agentdots
        # Funk asserts its half of the Agentdots contract and drives `funk update`
        # against that checkout, so the sibling has to be here or the suite refuses
        # to run. FUNK_AGENTDOTS_ROOT below is the override the suite already has,
        # which is why nothing needs to sit at ~/code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: possibilities/agentdots
          path: agentdots

      - name: Install test dependencies
        # The suite fakes brew, tailscale, adb, and the notifier through
        # tests/fixtures; these it runs for real. shellcheck especially:
        # validate.sh skips that pass when the binary is missing, and a green run
        # that silently linted nothing is the failure this repository warns about.
        run: |
          sudo apt-get update
          sudo apt-get install --yes stow zsh jq
      - name: Install pinned shellcheck
        # Not apt's: Ubuntu ships 0.9.0, which raises 39 SC2015 notes on
        # assertions that 0.11.0 does not emit even when the check is requested
        # by name — upstream retired it. Pinning the version is what lets
        # validate.sh keep every severity tier fatal instead of lowering the bar
        # to whatever the runner happens to package.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "$archive" "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version | sed -n 2p

      - name: Validate
        working-directory: funk
        env:
          FUNK_AGENTDOTS_ROOT: ${{ github.workspace }}/agentdots
        run: tests/validate.sh
