[keys]
prefix = "ctrl+space"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "escape-to-quit agentusage"
description = "usage"
width = "80%"
height = "80%"

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
