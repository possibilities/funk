[keys]
prefix = "ctrl+space"
previous_tab = ["prefix+p", "alt+1"]
next_tab = ["prefix+n", "alt+2"]
next_workspace = "alt+5"
previous_workspace = "alt+6"

# Herdr 0.8.0 has no move_tab_previous/move_tab_next keybind action yet; the
# helper drives the tab.move API instead. Swap both for the native action once
# the next release lands.
[[keys.command]]
key = "alt+3"
type = "shell"
command = "herdr-move-tab left"
description = "move tab left"

[[keys.command]]
key = "alt+4"
type = "shell"
command = "herdr-move-tab right"
description = "move tab right"

# Herdr 0.8.0 has no keybind action that creates a tab and starts a harness in
# it; the helper chains tab create + agent start. Tabs keep the default numeric
# name; agents are named <kind>-<n>.
[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "herdr-agent-tab claude"
description = "new tab running claude"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = "herdr-agent-tab codex"
description = "new tab running codex"

[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = "herdr-agent-tab pi"
description = "new tab running pi"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "escape-to-quit agentusage"
description = "usage"
width = "80%"
height = "80%"

# AgentSurface's launcher quits on esc itself, so no escape-to-quit wrapper.
# The whole flow runs in the popup: type the intent, confirm project /
# worktree / harness:model:effort, and the popup closes onto the new
# workspace with the agent started and the intent submitted.
[[keys.command]]
key = "prefix+l"
type = "popup"
command = "agentsurface launch"
description = "launch an agent"
width = "80%"
height = "80%"

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"
# "dots" renders working, blocked, and done all as a filled dot, separated only
# by hue; "symbols" gives each state its own glyph (working ◐, done ✓, blocked
# ×). Added after v0.8.0, so this key needs a master build.
status_indicators = "symbols"
# Agent memory per kind ("cc 3.4 / co 2.1"), summed over each agent pane's
# process tree by the stowed script beside this file. The status area ends
# flush against the terminal edge, and command output is trimmed before it is
# drawn, so the clearance has to come from a literal text entry — those keep
# their spaces. It reads as two columns: this pad plus the separator before it.
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/agent-mem.sh", interval_seconds = 10 },
  { type = "text", text = " " },
]

[ui.toast]
delivery = "herdr"

# The binary is built from ~/src/herdr by agentstart's update-herdr, so herdr's
# own update check would only offer a crossgrade back to the stable channel.
[update]
version_check = false

[experimental]
kitty_graphics = true
