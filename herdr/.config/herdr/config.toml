[keys]
prefix = "ctrl+space"
previous_tab = ["prefix+p", "alt+1"]
next_tab = ["prefix+n", "alt+2"]
next_workspace = "alt+5"
previous_workspace = "alt+6"

# Herdr 0.8.0 has no move_tab_previous/move_tab_next keybind action yet; the
# helper drives the tab.move API instead. Swap both for the native action once
# the next release lands.
[[keys.command]]
key = "alt+3"
type = "shell"
command = "herdr-move-tab left"
description = "move tab left"

[[keys.command]]
key = "alt+4"
type = "shell"
command = "herdr-move-tab right"
description = "move tab right"

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "escape-to-quit agentusage"
description = "usage"
width = "80%"
height = "80%"

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
