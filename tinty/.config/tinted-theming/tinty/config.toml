# Tinty configuration for theme management
# Documentation: https://github.com/tinted-theming/tinty

# Default theme to apply on first run
default-scheme = "base16-catppuccin-mocha"

# Ghostty terminal theme configuration using tinted-terminal
[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/ghostty"
hook = "cp -f %f ~/.config/ghostty/themes/tinted-theming && osascript -e 'tell application \"System Events\" to tell process \"Ghostty\" to click menu item \"Reload Configuration\" of menu 1 of menu bar item \"Ghostty\" of menu bar 1' 2>/dev/null"
supported-systems = ["base16", "base24"]

# FZF theme configuration
[[items]]
name = "tinted-fzf"
path = "https://github.com/tinted-theming/tinted-fzf"
themes-dir = "sh"
hook = "cp -f %f ~/.local/share/tinted-theming/tinty/fzf-colors.sh"
supported-systems = ["base16", "base24"]

# Neovim theme configuration
[[items]]
name = "tinted-nvim"
path = "https://github.com/tinted-theming/tinted-nvim"
themes-dir = "colors"
