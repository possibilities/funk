# agentvoice server configuration, Funk-owned: edit here (the agentvoice
# Stow package) and run `funk stow`; the server reads it — and the prompt
# files beside it — once at boot, so a restart applies changes.
#
# Every key left unset is not sent to codex at all and the machine's
# ~/.codex/config.toml applies. The posture here: the orchestrator runs in
# the global codex context (skills, MCP servers, AGENTS.md all visible) and
# is differentiated by doctrine (ORCHESTRATOR.md), not by capability
# stripping. Reference: ~/code/agentvoice/docs/field-guide.md.

accounts:
  # Every app-server spawn asks the balancer (agentusage balance codex,
  # falling back to codex-swap select) which ChatGPT account to run on, and
  # an idle child rotates off an account that crosses the threshold. Needs
  # profiles: `agentvoice accounts add <slug>` once per account — with
  # codex-swap installed and none logged in, boot exits with the exact
  # commands. Without the CLIs (other machines) this quietly runs canonical;
  # transient refusals mid-run fall back loudly.
  balance: true

orchestrator:
  # The worker-dispatch tools (dispatch_worker / check_workers /
  # cancel_worker) on the orchestrator's thread, with pushed
  # <worker_report> turns — the evented mode is off by default upstream,
  # and on here because the doctrine's "Keep the line open" section makes
  # the fire-and-forget promise against it.
  dispatch: true
  dispatch-reports: true

  # Not ultra: ultra additionally switches on codex's proactive multi-agent
  # mode, and dispatch policy belongs to the doctrine, not the model tier.
  effort: high

  # Guardian recipe: escalations outside the sandbox get an AI review
  # (~3 s) instead of agentvoice's blanket fail-closed denial.
  sandbox: workspace-write
  approval-policy: on-request
  approvals-reviewer: auto_review

  config:
    # Compact early and often: cheap summaries, and the doctrine
    # (developer instructions) re-injects in full after every compaction.
    model_auto_compact_token_limit: 60000

    # Asynchronous work belongs on app-server threads the system can
    # watch, not on in-thread subagents; this removes the spawn tools
    # outright (codex-rs: agents.enabled).
    agents: { enabled: false }

voice:
  # The orchestrator's [FINAL] line is the speakable channel; everything
  # else lands as commentary. Pairs with the doctrine's presentation
  # contract in ORCHESTRATOR.md.
  codex-response-handoff-mode: bemTags
