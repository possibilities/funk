name: control
server: control
windows:
  - name: arthack
    command: cd ~/code/arthack && processctl show-status --live

  - name: system
    command: cd ~/code/funk && processctl show-status --live

  - name: dashboard
    command: cd ~/code/arthack && processctl show-dashboard

  - name: browsers
    command: browserctl server-status --live

  - name: monitor
    command: btop
